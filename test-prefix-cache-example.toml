# Example configuration for testing vLLM prefix caching
# This generates 10k-token prompts where 50% share a 5000-token common prefix

[endpoint]
base_url = "http://localhost:8000/v1"
timeout = 300
max_tokens = 100

[load]
concurrent_requests = 10
duration_seconds = 60

[input]
file = "synthetic"
sample_size = 100

[input.synthetic]
# Generate prompts with 10k tokens
prompt_tokens = 10000

# Don't add unique prefixes (we'll use common prefix instead)
add_prefix = false

# 50% of samples share a common prefix
common_prefix_sample_ratio = 0.5

# The common prefix is 5000 tokens long
common_prefix_tokens = 5000

[output]
format = "console"

[log]
level = "info"
